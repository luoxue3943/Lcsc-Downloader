[package]
name = "lcsc-downloader"
version = "1.0.0"
edition = "2024"
rust-version = "1.93.0"
description = "立创元器件批量下载工具"
publish = false

[dependencies]
anyhow = "1.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
encoding_rs = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
tempfile = "3.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
