[package]
name = "Lcsc-Downloader"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "立创元器件批量下载工具"
publish = false

[dependencies]
anyhow = "1.0"
dirs = "6.0"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
encoding_rs = "0.8"
reqwest = { version = "0.13", features = ["json"] }
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
